name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'ci-builds/**'
      - 'xcodebuild.log'

permissions:
  contents: write

concurrency:
  group: ipa-build
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -list -project tvbox.xcodeproj
          if xcodebuild -list -project tvbox.xcodeproj | grep -qx "[[:space:]]*tvbox"; then
            TARGET_FLAG="-scheme tvbox"
          else
            TARGET_FLAG="-target tvbox"
          fi
          echo "using $TARGET_FLAG"
          xcodebuild \
            -project tvbox.xcodeproj \
            $TARGET_FLAG \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package IPA
        if: success()
        run: |
          VER=$(grep -E 'MARKETING_VERSION' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP=$(find build/Build/Products -maxdepth 2 -type d -name "TVBox.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::TVBox.app not found in build products"
            find build/Build/Products -maxdepth 2 -type d | head -20
            exit 1
          fi
          NAME="TVBox-${VER}-unsigned.ipa"
          echo "Packaging $APP -> $NAME"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          rm -rf Payload/TVBox.app/_CodeSignature
          ditto -c -k --sequesterRsrc --keepParent Payload "$NAME"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME"
          plutil -p Payload/TVBox.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleIdentifier|CFBundleDisplayName" || true

      - name: Backup artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "${{ env.IPA_NAME }}" \
            --title "TVBox unsigned IPA ${TAG}" \
            --notes "Unsigned IPA (sideload with TrollStore / AltStore). Built from ${GITHUB_SHA}." \
            || gh release upload "$TAG" "${{ env.IPA_NAME }}" --clobber
          echo "asset url: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${{ env.IPA_NAME }}"
